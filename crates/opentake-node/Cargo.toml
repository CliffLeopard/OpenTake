[package]
name = "opentake-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API (N-API) addon exposing the OpenTake Rust engine to the DSH plugin."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
opentake-core = { workspace = true }
opentake-domain = { workspace = true }
opentake-ops = { workspace = true }
opentake-media = { workspace = true, features = ["ort-backend"] }
opentake-render = { workspace = true }
opentake-project = { workspace = true }
base64 = "0.22"
velato = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = "2"
cpal = "0.15.3"

[build-dependencies]
napi-build = "2"
