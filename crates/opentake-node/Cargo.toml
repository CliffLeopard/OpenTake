[package]
name = "opentake-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API (N-API) addon exposing the OpenTake Rust engine to the DSH plugin."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
opentake-core = { workspace = true }
opentake-domain = { workspace = true }
opentake-ops = { workspace = true }
opentake-render = { workspace = true }
opentake-project = { workspace = true }
base64 = "0.22"
velato = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = "2"
cpal = "0.15.3"

# Search backend is target-selected: macOS arm64 keeps the native ORT build
# (fast CoreML/CPU path), every other target uses the pure-Rust tract backend so
# x64/Windows addons never link or load a native ONNX Runtime dylib.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
opentake-media = { workspace = true, features = ["ort-backend"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
opentake-media = { workspace = true, features = ["tract-backend"] }

[build-dependencies]
napi-build = "2"
